# ==============================================================================
# release.yml — Publica domains_cleans.bin como asset de un release
# ==============================================================================
# Motivo: GitHub NO contabiliza las descargas de ficheros raw del repositorio,
# pero sí las de los assets de un release (download_count). Publicando el binario
# también por esta vía podemos medir cuántas descargas recibe cada versión.
#
# Se dispara al llegar un binario nuevo. deploy.sh empuja en ese primer commit el
# .bin JUNTO a un version.json coherente con él (url al fichero raw), así que la
# versión que se lee aquí es siempre la del binario recién publicado. Después,
# deploy.sh espera a que este release exista y sólo entonces reescribe la url del
# version.json en un segundo commit — que ya no toca el .bin y por tanto no vuelve
# a disparar este workflow.
#
# El disparo manual se mantiene para republicar un release concreto a mano.
# ==============================================================================
name: Publicar release de la blacklist

on:
  push:
    branches: [main]
    paths:
      - domains_cleans.bin
  workflow_dispatch:
    inputs:
      version:
        description: "Número de lista a publicar (vacío = el de version.json)"
        required: false
        type: string

# Único permiso necesario: crear el release y subirle el binario.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Sin `uses:` a propósito, ni siquiera actions/checkout. Dos motivos:
      #   1. La resolución de acciones es un punto de fallo ajeno a nosotros: el
      #      2026-08-06 tumbó una publicación con "Failed to resolve action
      #      download info" + error interno de GitHub.
      #   2. Las acciones traen su propia versión de Node y arrastran los avisos
      #      de deprecación de los runners.
      # `gh` viene preinstalado en el runner, así que basta con pedir los dos
      # ficheros de ESTE commit — más preciso que clonar la rama, que podría
      # haber avanzado.
      - name: Traer version.json y el binario de este commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in version.json domains_cleans.bin; do
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/$GITHUB_REPOSITORY/contents/$f?ref=$GITHUB_SHA" > "$f"
          done
          ls -l version.json domains_cleans.bin

      - name: Determinar la versión de la lista
        id: v
        env:
          # Vía entorno y no interpolado en el script: un ${{ }} dentro de `run`
          # es una vía de inyección de comandos.
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            VERSION="$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')"
          fi
          case "$VERSION" in
            ''|*[!0-9]*) echo "Versión no numérica: '$VERSION'" >&2; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión de la lista: $VERSION"

      - name: Comprobar el binario antes de publicarlo
        run: |
          set -euo pipefail
          test -f domains_cleans.bin || { echo "Falta domains_cleans.bin" >&2; exit 1; }
          # Cabecera BDH1: magic(4) + timestamp(8) + recuento(4). Si el magic no
          # cuadra, el fichero no es una blacklist válida y no debe publicarse.
          MAGIC="$(head -c 4 domains_cleans.bin)"
          [ "$MAGIC" = "BDH1" ] || { echo "Cabecera inesperada: '$MAGIC'" >&2; exit 1; }
          # El tamaño tiene que cuadrar exactamente con el recuento de la cabecera
          # (16 de cabecera + 16 por hash). Detecta una descarga truncada, que la
          # comprobación del magic por sí sola no vería.
          # Recuento de hashes: 4 bytes big-endian en el offset 12. Se leen con od
          # (coreutils) para no depender del orden de bytes de la máquina.
          HEX="$(od -An -tx1 -j12 -N4 domains_cleans.bin | tr -d ' \n')"
          COUNT=$((16#$HEX))
          ESPERADO=$((16 + COUNT * 16))
          REAL=$(stat -c%s domains_cleans.bin)
          echo "dominios=$COUNT tamano=$REAL esperado=$ESPERADO"
          [ "$REAL" = "$ESPERADO" ] || { echo "Binario truncado o corrupto: no se publica" >&2; exit 1; }

      - name: Crear el release y adjuntar el binario
        env:
          GH_TOKEN: ${{ github.token }}
          # Sin checkout no hay .git del que `gh` pueda deducir el repositorio,
          # así que hay que decírselo. Y el tag se ancla al commit exacto que
          # disparó el workflow, no a donde esté la rama en ese momento.
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Sustituir el asset REINICIA su contador de descargas: sólo debería
            # ocurrir al repetir una ejecución, nunca en una publicación normal.
            echo "El release $TAG ya existe — se sustituye el binario."
            gh release upload "$TAG" domains_cleans.bin --clobber
          else
            gh release create "$TAG" domains_cleans.bin \
              --target "$GITHUB_SHA" \
              --title "Blacklist $TAG" \
              --notes "Lista de dominios bloqueados, versión $TAG.

          El binario va firmado con Ed25519; la firma (signedHash) viaja en version.json
          y las aplicaciones la verifican antes de instalar la lista."
          fi
          gh release view "$TAG"
